services:
  corretor-gabarito:
    build:
      context: .
      dockerfile: Dockerfile
    image: corretor-gabarito:latest
    container_name: corretor-gabarito
    ports:
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # Volumes opcionais (descomente caso queira alterar código e ver alterações sem rebuild):
    # volumes:
    #   - ./app.py:/app/app.py
    #   - ./gabarito:/app/gabarito
    #   - ./estilo.css:/app/estilo.css
    #   - ./amostras:/app/amostras
